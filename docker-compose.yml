
services:
  app:
    container_name: portfolio-app

    # stdin_open: true # оставляет стандартный ввод открытым
    # tty: true # выделяет контейнеру виртуальный терминал.

    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

    env_file:
      - .env.docker

    command: npm run dev -- --hostname 0.0.0.0

    depends_on:
      db:
        condition: service_healthy

  db: # db или postgres
    container_name: portfolio-db
    image: postgres:17

    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: portfolio

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    # Docker требует, чтобы имена контейнеров были уникальными во всей системе Docker. Если не указать container_name, Docker автоматически сгенерирует уникальное имя для контейнера. Если нужно использовать конкретное имя контейнера, можно раскомментировать следующую строку и указать желаемое имя.
    # container_name: local-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db  # должен повторять название сервиса
      # ADMINER_DESIGN: pepa-linha # Опционально: тема оформления
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  node_modules:
  next_cache:
  postgres_data:
